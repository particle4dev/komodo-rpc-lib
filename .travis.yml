# Config adapted from:
# https://www.electron.build/multi-platform-build#sample-travisyml-to-build-electron-app-for-macos-linux-and-windows
sudo: true

matrix:
  allow_failures:
    - os: windows
    - node_js: node
  include:
    - os: osx
      osx_image: xcode9.4
      language: node_js
      node_js:
        - 11
        - 10
        - 8

    - os: linux
      services: docker
      language: node_js
      node_js:
        - 11
        - 10
        - 8
  
    - os: windows
      language: node_js
      node_js:
        - 11
        - 10
        - 8

script:
  - chmod +x ./src/daemon/__tests__/app
  - 'yarn lint'
  - 'yarn test --coverage'

cache:
  - yarn

after_success:
  - 'cat ./coverage/lcov.info | ./node_modules/.bin/coveralls'
  - npm publish
 
notifications:
  email:
    recipients:
      - particle4dev@gmail.com
    on_success: never
    on_failure: always

git:
  depth: 1

deploy:
  provider: npm
  email: particle4dev@gmail.com
  api_key:
    secure: 
  on:
    repo: particle4dev/komodo-rpc-lib 
    all_branches: true